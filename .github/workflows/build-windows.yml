name: Build ZeidlerGPT Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct ZeidlerGPT source
        shell: powershell
        run: |
          $parts = Get-ChildItem ".build10\source.part*.b64" | Sort-Object Name
          if ($parts.Count -ne 12) {
            throw "Expected 12 main source parts, found $($parts.Count)."
          }
          $base64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $tail = (Get-Content ".build\source.part005.b64" -Raw).Trim()
          $base64 += $tail
          [IO.File]::WriteAllBytes("ZeidlerGPT-bootstrap.zip", [Convert]::FromBase64String($base64))
          Expand-Archive -Path "ZeidlerGPT-bootstrap.zip" -DestinationPath "build-source" -Force
          if (-not (Test-Path "build-source\ZeidlerGPT-V3.0.1\package.json")) {
            throw "Source archive was reconstructed but package.json was not found."
          }

      - name: Fix electron-builder v26 config
        shell: powershell
        run: |
          $packagePath = "build-source\ZeidlerGPT-V3.0.1\package.json"
          $pkg = Get-Content $packagePath -Raw | ConvertFrom-Json
          if ($null -ne $pkg.build.win.publisherName) {
            $pkg.build.win.PSObject.Properties.Remove("publisherName")
          }
          $json = $pkg | ConvertTo-Json -Depth 20
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($packagePath, $json, $utf8NoBom)
          Write-Host "Removed obsolete build.win.publisherName and wrote package.json as UTF-8 without BOM."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: build-source/ZeidlerGPT-V3.0.1
        shell: powershell
        run: npm install

      - name: Smoke test
        working-directory: build-source/ZeidlerGPT-V3.0.1
        shell: powershell
        run: npm run smoke

      - name: Build Windows installer and portable EXE
        working-directory: build-source/ZeidlerGPT-V3.0.1
        shell: powershell
        run: |
          npm run build
          npx electron-builder --win nsis --publish never
          Move-Item "dist-installer\ZeidlerGPT-3.0.1-x64.exe" "dist-installer\ZeidlerGPT-Setup-3.0.1-x64.exe" -Force
          if (Test-Path "dist-installer\ZeidlerGPT-3.0.1-x64.exe.blockmap") {
            Move-Item "dist-installer\ZeidlerGPT-3.0.1-x64.exe.blockmap" "dist-installer\ZeidlerGPT-Setup-3.0.1-x64.exe.blockmap" -Force
          }
          npx electron-builder --win portable --publish never

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeidlerGPT-V3.0.1-Windows
          path: |
            build-source/ZeidlerGPT-V3.0.1/dist-installer/*.exe
            build-source/ZeidlerGPT-V3.0.1/dist-installer/*.blockmap
          if-no-files-found: error
